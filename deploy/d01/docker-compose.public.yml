services:
  web:
    build:
      context: ../..
      dockerfile: deploy/d01/Dockerfile.public
      args:
        VITE_DATA_PROVIDER: api
        VITE_AGENT_TC_API_URL: /api
    image: agent-tc-web:local
    container_name: agent-tc-web
    restart: unless-stopped
    ports:
      - "${AGENT_TC_PUBLIC_HTTP_PORT:-8000}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - agent-tc-caddy-config:/config

volumes:
  agent-tc-caddy-config:
